<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CivicFix AI - Offline</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-600: #475569;
      --slate-800: #1e293b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: var(--slate-50);
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: #eff6ff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      color: var(--primary);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--slate-800);
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--slate-600);
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: #fef3c7;
      color: #92400e;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }
    .btn-outline {
      background: #ffffff;
      color: var(--slate-600);
      border: 1px solid #cbd5e1;
    }
    .btn-outline:hover {
      background: var(--slate-100);
    }
    .status-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrapper">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <span class="badge">📡 Offline Mode</span>
    <h1>You're Currently Offline</h1>
    <p>
      CivicFix AI requires an internet connection to sync live complaints and submit verified resolutions.
      Any complaint drafts you have saved locally in IndexedDB are safe and preserved on your device.
    </p>
    <button class="btn btn-primary" onclick="retryConnection()">
      🔄 Check Connection &amp; Retry
    </button>
    <a href="/" class="btn btn-outline">
      ← Return to Cached App
    </a>
    <div class="status-text" id="statusNotice">Listening for network restoration…</div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.querySelector('.btn-primary');
      btn.innerText = 'Checking connection…';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          btn.innerText = '🔄 Still Offline - Try Again';
        }, 600);
      }
    }

    window.addEventListener('online', () => {
      document.getElementById('statusNotice').innerText = '✓ Connection restored! Reloading…';
      setTimeout(() => {
        window.location.reload();
      }, 500);
    });
  </script>
</body>
</html>
